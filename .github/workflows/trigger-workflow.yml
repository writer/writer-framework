name: Trigger agent manager

on:
  workflow_call:
    inputs:
      event_type:
        description: 'Event type to send to the agent manager'
        required: true
        type: string
      extra_payload:
        description: 'Additional arbitrary JSON payload to send'
        required: false
        type: string
        default: "{}"
    secrets:
      AGENT_MANAGER_PAT:
        description: 'Personal Access Token for triggering agent manager repo'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger agent manager
      run: |
        repo_owner="WriterInternal"
        repo_name="be.agent-manager"
        event_type="${{ inputs.event_type }}"
        commit_sha="${{ github.sha }}"
        extra_payload='${{ inputs.extra_payload }}'

        echo "Triggering agent manager with event_type=$event_type"
        echo "Extra payload (raw): $extra_payload"

        compact_payload=$(echo "$extra_payload" | jq -c .)
        echo "Compact payload: $compact_payload"

        merged_payload=$(echo "$compact_payload" | jq -c \
          --arg commit_sha "$commit_sha" \
          '. + {commit_sha: $commit_sha}')

        echo "Merged payload: $merged_payload"

        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.AGENT_MANAGER_PAT }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
          -d "{\"event_type\": \"$event_type\", \"client_payload\": $merged_payload}"
